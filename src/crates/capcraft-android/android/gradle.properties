org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# The Rust library's ABIs. arm64-v8a is the one phones need; build one to save time,
# e.g. `./gradlew assembleRelease -Pnoracraft.abis=arm64-v8a`.
noracraft.abis=arm64-v8a
capcraft.abis=arm64-v8a

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it.
noracraft.version=1.0.0
noracraft.versionCode=1000099
capcraft.version=1.0.0
capcraft.versionCode=1000099

# Skip the cargo build and ship a prebuilt libcapcraft_android.so (UI-only changes on
# a machine without the Linux/FFmpeg toolchain). Remove this line for a full engine build.
noracraft.prebuiltJniLibs=J:\\NORAcraft\\src\\crates\\capcraft-android\\android\\vendor-jniLibs
